name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # blank 1 — the branch you've pushed all night

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci # blank 2 — lockfile-exact install, built for CI
      - run: npm run build # blank 3 — same script you ran in 1.5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist # blank 4 — the folder you toured in 1.5
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
